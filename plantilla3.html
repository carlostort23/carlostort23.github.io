<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>💌</title>

<!--
  ╔══════════════════════════════╗
  ║  EDITA SOLO ESTO             ║
  ╠══════════════════════════════╣
  ║  frase → tu texto            ║
  ║  foto  → ruta a la imagen    ║
  ║  color → tema de fondo       ║
  ║  coral | mint | sky | lemon  ║
  ║  lilac | rose | peach        ║
  ╚══════════════════════════════╝
-->
<script>
const CONFIG = {
  frase: "Ponernos guapos y salir a cenar y tomar algo 🌺🌺",
  foto:  "img/coche.jpeg",
  color: "coral",
};
</script>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@800&display=swap" rel="stylesheet">

<style>
:root {
  --c1: #FF8B6B; --c2: #FFB49A; --c3: #FFF0EB; --ctext: #5A1A08;
}
.mint   { --c1:#52C99A; --c2:#A8E6CF; --c3:#EDFDF5; --ctext:#0A3D25; }
.sky    { --c1:#3BAADC; --c2:#8DD4F0; --c3:#EAF7FF; --ctext:#083050; }
.lemon  { --c1:#F5CC00; --c2:#FFE566; --c3:#FFFDE8; --ctext:#3D2F00; }
.lilac  { --c1:#9B6FDF; --c2:#C8A8FF; --c3:#F3EEFF; --ctext:#2D0A60; }
.rose   { --c1:#FF5C8A; --c2:#FFB0C8; --c3:#FFF0F5; --ctext:#5A0028; }
.peach  { --c1:#FF9A5C; --c2:#FFD0A8; --c3:#FFF5EE; --ctext:#4A1800; }

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100dvh;
  background: var(--c3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 28px max(40px, env(safe-area-inset-bottom));
  font-family: 'Nunito', sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  position: relative;
}

/* BG blobs */
body::before {
  content:''; position:fixed;
  width:70vw; height:70vw; border-radius:50%;
  background:radial-gradient(circle, var(--c2), transparent 70%);
  top:-20vw; right:-20vw; z-index:0; pointer-events:none; opacity:0.5;
}
body::after {
  content:''; position:fixed;
  width:50vw; height:50vw; border-radius:50%;
  background:radial-gradient(circle, var(--c2), transparent 70%);
  bottom:-10vw; left:-10vw; z-index:0; pointer-events:none; opacity:0.4;
}

/* ── FRASE ── */
#frase {
  position: relative; z-index:5;
  font-family: 'Caveat', cursive;
  font-size: clamp(22px, 6.5vw, 30px);
  font-weight: 700;
  color: var(--ctext);
  text-align: center;
  line-height: 1.4;
  margin-bottom: 32px;
  max-width: 320px;
  animation: fadeDown 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s both;
}
@keyframes fadeDown {
  from { opacity:0; transform:translateY(-16px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── MARCO ── */
#marco-wrap {
  position: relative; z-index:5;
  animation: popIn 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
}
@keyframes popIn {
  from { opacity:0; transform:scale(0.8) rotate(-3deg); }
  to   { opacity:1; transform:scale(1)   rotate(-2deg); }
}

#marco {
  width: min(280px, 78vw);
  height: min(280px, 78vw);
  border-radius: 24px;
  overflow: hidden;
  background: white;
  padding: 10px;
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.06),
    0 8px 24px rgba(0,0,0,0.12),
    0 24px 48px rgba(0,0,0,0.08);
  position: relative;
  cursor: pointer;
}

/* Borde de color */
#marco::before {
  content:''; position:absolute; inset:0; border-radius:24px;
  background: linear-gradient(135deg, var(--c1), var(--c2));
  z-index:0;
}
#marco::after {
  content:''; position:absolute; inset:10px; border-radius:16px;
  background:white; z-index:1;
}

#foto-area {
  position:absolute; inset:10px; border-radius:16px;
  overflow:hidden; z-index:2;
  background:linear-gradient(135deg, #f0f0f0, #e0e0e0);
  display:flex; align-items:center; justify-content:center;
}
#foto-area img {
  width:100%; height:100%; object-fit:cover; display:block;
}
#placeholder {
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
#placeholder span:first-child { font-size:44px; }
#placeholder span:last-child {
  font-size:11px; font-weight:800; color:#bbb;
  text-transform:uppercase; letter-spacing:0.1em;
}

/* shimmer on load */
#foto-area::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
  animation: shimmer 1s ease-out 1s both;
  background-size:200% 100%;
}
@keyframes shimmer {
  from { background-position:200% 0; }
  to   { background-position:-200% 0; }
}

#file-input { display:none; }
</style>
</head>
<body>

<input type="file" id="file-input" accept="image/*">

<p id="frase"></p>

<div id="marco-wrap">
  <div id="marco">
    <div id="foto-area" onclick="document.getElementById('file-input').click()">
      <div id="placeholder">
        <span>📷</span>
        <span>tu foto aquí</span>
      </div>
    </div>
  </div>
</div>

<script>
const C = CONFIG;

// Tema
const temas = { coral:'', mint:'mint', sky:'sky', lemon:'lemon', lilac:'lilac', rose:'rose', peach:'peach' };
if (temas[C.color]) document.body.classList.add(temas[C.color]);

// Frase
document.getElementById('frase').textContent = C.frase;

// Foto
function setFoto(src) {
  const area = document.getElementById('foto-area');
  const ph   = document.getElementById('placeholder');
  let img = area.querySelector('img');
  if (!img) { img = document.createElement('img'); area.insertBefore(img, area.firstChild); }
  img.src = src;
  ph.style.display = 'none';
}
if (C.foto && C.foto !== 'foto.jpg') {
  const t = new Image(); t.onload = () => setFoto(C.foto); t.src = C.foto;
}
document.getElementById('file-input').addEventListener('change', function(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = ev => setFoto(ev.target.result); r.readAsDataURL(f);
});
</script>
</body>
</html>
